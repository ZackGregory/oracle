name: Update Scryfall oracle cards and Magic Comp Rules

on:
  schedule:
    # Once a day at 12:37 UTC. Scryfall regenerates its bulk files every 12-24
    # hours; the odd minute keeps this off the top-of-the-hour queue, which
    # GitHub delays the most. If Scryfall's updated_at usually lands later
    # than this, move the hour.
    - cron: "37 12 * * *"
  workflow_dispatch: # also lets you run it by hand from the Actions tab

# The job needs to push a commit and upload release assets.
permissions:
  contents: write

# Never let a manual run and a scheduled run push at the same time.
concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  ORACLE_RELEASE_TAG: oracle-cards
  ORACLE_ASSET_NAME: oracle-cards.jsonl.gz
  ORACLE_META_FILE: oracle-cards.meta.json
  RULES_RELEASE_TAG: magic-comp-rules
  RULES_ASSET_NAME: magic-comp-rules.pdf
  RULES_TXT_ASSET_NAME: magic-comp-rules.txt
  RULES_META_FILE: magic-comp-rules.meta.json
  RULES_PAGE_URL: https://magic.wizards.com/en/rules
  # Scryfall rejects API requests that don't identify themselves.
  SCRYFALL_UA: "github.com/${{ github.repository }} (oracle-cards refresh workflow)"
  RULES_UA: "github.com/${{ github.repository }} (magic-comp-rules refresh workflow)"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash # explicit "bash" gives -e and -o pipefail, so a failing pipe fails the step

    steps:
      - uses: actions/checkout@v6

      - name: Ask Scryfall which oracle_cards file is current
        id: index
        run: |
          curl --silent --show-error --fail --retry 3 \
            -H "User-Agent: $SCRYFALL_UA" \
            -H "Accept: application/json" \
            https://api.scryfall.com/bulk-data > bulk-index.json

          if ! jq -e '.data[] | select(.type == "oracle_cards")' bulk-index.json > entry.json; then
            echo "::error::No oracle_cards entry in Scryfall's bulk-data index. Response was:"
            cat bulk-index.json
            exit 1
          fi

          updated_at=$(jq -r '.updated_at // empty' entry.json)
          # Prefer a JSONL download if Scryfall offers one; otherwise fall back
          # to the standard JSON-array download and convert it later.
          jsonl_uri=$(jq -r '.jsonl_download_uri // empty' entry.json)
          json_uri=$(jq -r '.download_uri // empty' entry.json)
          if [ -n "$jsonl_uri" ]; then
            uri="$jsonl_uri"; format=jsonl
          else
            uri="$json_uri"; format=json
          fi

          if [ -z "$updated_at" ] || [ -z "$uri" ]; then
            echo "::error::oracle_cards entry is missing updated_at or a download URI. Entry was:"
            cat entry.json
            exit 1
          fi

          {
            echo "updated_at=$updated_at"
            echo "download_uri=$uri"
            echo "format=$format"
          } >> "$GITHUB_OUTPUT"
          echo "Current Scryfall build: $updated_at -> $uri ($format)"

      - name: Skip if the published Scryfall build is already this one
        id: check_oracle
        env:
          UPDATED_AT: ${{ steps.index.outputs.updated_at }}
        run: |
          previous=$(jq -r '.scryfall_updated_at // empty' "$ORACLE_META_FILE" 2>/dev/null || true)
          if [ "$previous" = "$UPDATED_AT" ]; then
            echo "Already published Scryfall build $UPDATED_AT - nothing to do."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Scryfall build: $UPDATED_AT (had: ${previous:-none})"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover the current Magic Comp Rules PDF and TXT URLs
        id: discover_rules
        run: |
          curl --silent --show-error --fail --location --retry 3 \
            -H "User-Agent: $RULES_UA" \
            -H "Accept: text/html,application/xhtml+xml" \
            "$RULES_PAGE_URL" > rules.html

          # The Python below is indented to match this run block. YAML strips
          # that shared indentation, so Python still sees top-level code.
          # It writes pdf_url, txt_url and filename_date to $GITHUB_OUTPUT.
          if ! python3 - <<'PY'
          import datetime
          import html
          import os
          import pathlib
          import re
          import sys
          from urllib.parse import quote, unquote, urljoin

          page = pathlib.Path("rules.html").read_text(encoding="utf-8", errors="replace")
          base = "https://magic.wizards.com/en/rules"
          comp_rules = re.compile(r"magiccomp|magic.*comp.*rules|comp.*rules", re.I)

          def clean(url):
              # Hrefs can contain HTML entities (&amp;) and raw spaces, which
              # curl rejects. Percent-encode anything unsafe, but leave
              # existing %XX escapes and URL punctuation alone.
              url = urljoin(base, html.unescape(url).strip())
              return quote(url, safe=":/?#[]@!$&'()*+,;=%~")

          def links(ext):
              pattern = rf'''(?i)(?:href|src)=["']([^"']+?\.{ext}(?:\?[^"']*)?)["']'''
              # dict.fromkeys de-duplicates while keeping page order.
              return list(dict.fromkeys(clean(m) for m in re.findall(pattern, page)))

          def stem(url):
              # "…/MagicCompRules%2020260925.pdf?x" -> "MagicCompRules 20260925"
              name = unquote(url.split("?", 1)[0].rsplit("/", 1)[-1])
              return name.rsplit(".", 1)[0]

          def pick(candidates, prefer_stem=None):
              if prefer_stem:
                  for item in candidates:
                      if stem(item) == prefer_stem:
                          return item
              for item in candidates:
                  if comp_rules.search(item):
                      return item
              return candidates[0] if candidates else None

          pdf_url = pick(links("pdf"))
          if not pdf_url:
              print("::error::Could not find a Magic Comp Rules PDF URL on the rules page")
              sys.exit(1)

          # Prefer the TXT with the same file name as the PDF, so the two
          # assets are always the same edition.
          txt_url = pick(links("txt"), prefer_stem=stem(pdf_url))
          if not txt_url:
              print("::error::Could not find a Magic Comp Rules TXT URL on the rules page")
              sys.exit(1)
          if stem(txt_url) != stem(pdf_url):
              print(f"::warning::PDF and TXT file names differ ({stem(pdf_url)!r} vs {stem(txt_url)!r}); "
                    "they may be different editions.")

          # The file names carry a YYYYMMDD stamp (e.g. "MagicCompRules 20260925").
          # Kept as a fallback in case the date can't be read from the TXT itself.
          filename_date = ""
          for s in (stem(pdf_url), stem(txt_url)):
              m = re.search(r"(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)", s)
              if m:
                  try:
                      filename_date = datetime.date(*map(int, m.groups())).isoformat()
                      break
                  except ValueError:
                      pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pdf_url={pdf_url}\n")
              out.write(f"txt_url={txt_url}\n")
              out.write(f"filename_date={filename_date}\n")

          print(f"Current Magic Comp Rules PDF: {pdf_url}")
          print(f"Current Magic Comp Rules TXT: {txt_url}")
          print(f"Date in file name: {filename_date or 'none found'}")
          PY
          then
            echo "--- rules page preview ---"
            sed -n '1,160p' rules.html
            exit 1
          fi

      - name: Skip if the published rules files are already these ones
        id: check_rules
        env:
          PDF_URL: ${{ steps.discover_rules.outputs.pdf_url }}
          TXT_URL: ${{ steps.discover_rules.outputs.txt_url }}
        run: |
          prev_pdf=$(jq -r '.pdf_url // empty' "$RULES_META_FILE" 2>/dev/null || true)
          prev_txt=$(jq -r '.txt_url // empty' "$RULES_META_FILE" 2>/dev/null || true)
          # Metadata written before the TXT was tracked has no txt_url, so the
          # first run after this change refreshes once and backfills it.
          if [ "$prev_pdf" = "$PDF_URL" ] && [ "$prev_txt" = "$TXT_URL" ]; then
            echo "Already published Magic Comp Rules $PDF_URL and $TXT_URL - nothing to do."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Magic Comp Rules:"
            echo "  PDF: $PDF_URL (had: ${prev_pdf:-none})"
            echo "  TXT: $TXT_URL (had: ${prev_txt:-none})"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify the oracle card data
        id: fetch_oracle
        if: steps.check_oracle.outputs.fresh == 'true'
        env:
          DOWNLOAD_URI: ${{ steps.index.outputs.download_uri }}
          FORMAT: ${{ steps.index.outputs.format }}
        run: |
          curl --silent --show-error --fail --location --retry 3 \
            -H "User-Agent: $SCRYFALL_UA" \
            -H "Accept: */*" \
            -o download.bin \
            "$DOWNLOAD_URI"

          # Undo gzip if the payload arrived compressed.
          if gzip -t download.bin 2>/dev/null; then
            gzip -dc download.bin > download.raw
          else
            mv download.bin download.raw
          fi

          # Normalize to one card object per line.
          if [ "$FORMAT" = "json" ]; then
            jq -c '.[]' download.raw > oracle-cards.jsonl
          else
            mv download.raw oracle-cards.jsonl
          fi

          count=$(wc -l < oracle-cards.jsonl)
          head -n 1 oracle-cards.jsonl | jq -e '.object == "card"' > /dev/null
          test "$count" -ge 10000

          gzip -9 -n -c oracle-cards.jsonl > "$ORACLE_ASSET_NAME"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Verified $count cards in $ORACLE_ASSET_NAME ($(du -h "$ORACLE_ASSET_NAME" | cut -f1))"

      - name: Download and verify the Magic Comp Rules PDF
        id: fetch_rules
        if: steps.check_rules.outputs.fresh == 'true'
        env:
          PDF_URL: ${{ steps.discover_rules.outputs.pdf_url }}
        run: |
          curl --silent --show-error --fail --location --retry 3 \
            -H "User-Agent: $RULES_UA" \
            -H "Accept: application/pdf, */*" \
            -o "$RULES_ASSET_NAME" \
            "$PDF_URL"

          test -s "$RULES_ASSET_NAME"
          # Every PDF starts with the "%PDF-" magic bytes; no poppler needed.
          if [ "$(head -c 5 "$RULES_ASSET_NAME")" != "%PDF-" ]; then
            echo "::error::Downloaded file is not a PDF:"
            file "$RULES_ASSET_NAME" || true
            exit 1
          fi

          echo "Verified $RULES_ASSET_NAME ($(du -h "$RULES_ASSET_NAME" | cut -f1))"

      - name: Download and verify the Magic Comp Rules TXT, and read its edition date
        id: fetch_rules_txt
        if: steps.check_rules.outputs.fresh == 'true'
        env:
          TXT_URL: ${{ steps.discover_rules.outputs.txt_url }}
          FILENAME_DATE: ${{ steps.discover_rules.outputs.filename_date }}
        run: |
          curl --silent --show-error --fail --location --retry 3 \
            -H "User-Agent: $RULES_UA" \
            -H "Accept: text/plain, */*" \
            -o "$RULES_TXT_ASSET_NAME" \
            "$TXT_URL"

          test -s "$RULES_TXT_ASSET_NAME"

          # The file is published as-is (BOM, CRLF line endings and all); the
          # Python only reads it. It checks that it really is the rules text
          # and pulls the "These rules are effective as of <date>." line.
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import re
          import sys

          path = pathlib.Path(os.environ["RULES_TXT_ASSET_NAME"])
          raw = path.read_bytes()

          # Wizards has shipped this file as UTF-8 (often with a BOM) and, in
          # older editions, as Windows-1252; handle UTF-16 too, just in case.
          if raw.startswith((b"\xff\xfe", b"\xfe\xff")):
              text = raw.decode("utf-16")
          else:
              for encoding in ("utf-8-sig", "cp1252"):
                  try:
                      text = raw.decode(encoding)
                      break
                  except UnicodeDecodeError:
                      continue
              else:
                  text = raw.decode("utf-8", errors="replace")

          head = text[:5000]
          if re.search(r"<!doctype|<html", head, re.I):
              print("::error::Downloaded TXT looks like an HTML page, not the rules text")
              sys.exit(1)
          if "comprehensive rules" not in head.lower():
              print("::error::Downloaded TXT does not look like the Comprehensive Rules:")
              print(head[:800])
              sys.exit(1)

          filename_date = os.environ.get("FILENAME_DATE", "")
          text_date = ""
          normalized = head.replace("\u00a0", " ")
          m = re.search(r"effective\s+as\s+of\s+([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})", normalized, re.I)
          if m:
              month, day, year = m.groups()
              try:
                  text_date = datetime.datetime.strptime(
                      f"{month.title()} {day} {year}", "%B %d %Y"
                  ).date().isoformat()
              except ValueError:
                  print(f"::warning::Could not parse effective date {m.group(0)!r}")

          if text_date:
              edition_date, source = text_date, "txt"
              if filename_date and filename_date != text_date:
                  print(f"::notice::Effective date {text_date} differs from file-name date {filename_date}; "
                        "using the effective date.")
          elif filename_date:
              edition_date, source = filename_date, "filename"
              print(f"::warning::No 'effective as of' line found in the TXT; "
                    f"using the file-name date {filename_date}.")
          else:
              print("::error::Could not determine the Comprehensive Rules edition date "
                    "from the TXT or the file names.")
              print(head[:800])
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"edition_date={edition_date}\n")
              out.write(f"edition_date_source={source}\n")

          print(f"Comprehensive Rules edition: {edition_date} (from {source})")
          PY

          echo "Verified $RULES_TXT_ASSET_NAME ($(du -h "$RULES_TXT_ASSET_NAME" | cut -f1))"

      - name: Write oracle metadata
        if: steps.check_oracle.outputs.fresh == 'true'
        env:
          UPDATED_AT: ${{ steps.index.outputs.updated_at }}
          DOWNLOAD_URI: ${{ steps.index.outputs.download_uri }}
          COUNT: ${{ steps.fetch_oracle.outputs.count }}
        run: |
          jq -n \
            --arg updated_at "$UPDATED_AT" \
            --arg source "$DOWNLOAD_URI" \
            --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson count "$COUNT" \
            --arg asset "$ORACLE_ASSET_NAME" \
            --argjson bytes "$(stat -c %s "$ORACLE_ASSET_NAME")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$ORACLE_RELEASE_TAG/$ORACLE_ASSET_NAME" \
            --arg sha256 "$(sha256sum "$ORACLE_ASSET_NAME" | cut -d ' ' -f 1)" \
            '{
              scryfall_updated_at: $updated_at,
              scryfall_source: $source,
              fetched_at: $fetched_at,
              card_count: $count,
              asset: $asset,
              bytes: $bytes,
              download_url: $url,
              sha256: $sha256
            }' > "$ORACLE_META_FILE"
          cat "$ORACLE_META_FILE"

      - name: Write rules metadata
        if: steps.check_rules.outputs.fresh == 'true'
        env:
          PDF_URL: ${{ steps.discover_rules.outputs.pdf_url }}
          TXT_URL: ${{ steps.discover_rules.outputs.txt_url }}
          FILENAME_DATE: ${{ steps.discover_rules.outputs.filename_date }}
          EDITION_DATE: ${{ steps.fetch_rules_txt.outputs.edition_date }}
          EDITION_DATE_SOURCE: ${{ steps.fetch_rules_txt.outputs.edition_date_source }}
        run: |
          release_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RULES_RELEASE_TAG"
          # The PDF keys keep their original names so existing readers of this
          # file keep working; the TXT gets txt_-prefixed equivalents.
          jq -n \
            --arg edition_date "$EDITION_DATE" \
            --arg edition_date_source "$EDITION_DATE_SOURCE" \
            --arg filename_date "$FILENAME_DATE" \
            --arg source_page "$RULES_PAGE_URL" \
            --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg pdf_url "$PDF_URL" \
            --arg asset "$RULES_ASSET_NAME" \
            --argjson bytes "$(stat -c %s "$RULES_ASSET_NAME")" \
            --arg url "$release_base/$RULES_ASSET_NAME" \
            --arg sha256 "$(sha256sum "$RULES_ASSET_NAME" | cut -d ' ' -f 1)" \
            --arg txt_url "$TXT_URL" \
            --arg txt_asset "$RULES_TXT_ASSET_NAME" \
            --argjson txt_bytes "$(stat -c %s "$RULES_TXT_ASSET_NAME")" \
            --arg txt_download_url "$release_base/$RULES_TXT_ASSET_NAME" \
            --arg txt_sha256 "$(sha256sum "$RULES_TXT_ASSET_NAME" | cut -d ' ' -f 1)" \
            '{
              edition_date: $edition_date,
              edition_date_source: $edition_date_source,
              filename_date: (if $filename_date == "" then null else $filename_date end),
              source_page: $source_page,
              fetched_at: $fetched_at,
              pdf_url: $pdf_url,
              asset: $asset,
              bytes: $bytes,
              download_url: $url,
              sha256: $sha256,
              txt_url: $txt_url,
              txt_asset: $txt_asset,
              txt_bytes: $txt_bytes,
              txt_download_url: $txt_download_url,
              txt_sha256: $txt_sha256
            }' > "$RULES_META_FILE"
          cat "$RULES_META_FILE"

      - name: Publish refreshed oracle assets
        if: steps.check_oracle.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATED_AT: ${{ steps.index.outputs.updated_at }}
          COUNT: ${{ steps.fetch_oracle.outputs.count }}
        run: |
          notes="Scryfall oracle_cards build $UPDATED_AT, $COUNT cards, gzipped JSONL (one card object per line). Checksum and details in $ORACLE_META_FILE."
          if gh release view "$ORACLE_RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$ORACLE_RELEASE_TAG" --notes "$notes"
          else
            gh release create "$ORACLE_RELEASE_TAG" --title "Scryfall oracle cards (rolling)" --notes "$notes"
          fi
          gh release upload "$ORACLE_RELEASE_TAG" "$ORACLE_ASSET_NAME" "$ORACLE_META_FILE" --clobber

      - name: Publish refreshed rules assets
        if: steps.check_rules.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PDF_URL: ${{ steps.discover_rules.outputs.pdf_url }}
          TXT_URL: ${{ steps.discover_rules.outputs.txt_url }}
          EDITION_DATE: ${{ steps.fetch_rules_txt.outputs.edition_date }}
        run: |
          notes="Magic Comprehensive Rules effective $EDITION_DATE, as PDF and TXT, from $RULES_PAGE_URL. Sources: $PDF_URL and $TXT_URL. Checksums and details in $RULES_META_FILE."
          if gh release view "$RULES_RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RULES_RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RULES_RELEASE_TAG" --title "Magic Comprehensive Rules (rolling)" --notes "$notes"
          fi
          gh release upload "$RULES_RELEASE_TAG" \
            "$RULES_ASSET_NAME" "$RULES_TXT_ASSET_NAME" "$RULES_META_FILE" --clobber

      - name: Commit the metadata
        if: steps.check_oracle.outputs.fresh == 'true' || steps.check_rules.outputs.fresh == 'true'
        env:
          UPDATED_AT: ${{ steps.index.outputs.updated_at }}
          EDITION_DATE: ${{ steps.fetch_rules_txt.outputs.edition_date }}
          ORACLE_FRESH: ${{ steps.check_oracle.outputs.fresh }}
          RULES_FRESH: ${{ steps.check_rules.outputs.fresh }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=()
          [ -f "$ORACLE_META_FILE" ] && files+=("$ORACLE_META_FILE")
          [ -f "$RULES_META_FILE" ] && files+=("$RULES_META_FILE")

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No metadata files updated; nothing to commit."
            exit 0
          fi

          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          if [ "$ORACLE_FRESH" = "true" ] && [ "$RULES_FRESH" = "true" ]; then
            git commit -m "oracle cards + rules: Scryfall build $UPDATED_AT and Comp Rules effective $EDITION_DATE"
          elif [ "$ORACLE_FRESH" = "true" ]; then
            git commit -m "oracle cards: Scryfall build $UPDATED_AT"
          else
            git commit -m "rules: Comp Rules effective $EDITION_DATE (PDF + TXT)"
          fi

          # Rebase and retry if the branch moved while this job was running.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing and retrying..."
            git pull --rebase
          done
          echo "::error::Could not push metadata after 3 attempts."
          exit 1
